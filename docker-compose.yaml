services:
  broker-1:
    image: apache/kafka:4.4.0
    env_file: ./kafka.env
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker-1:9092,EXTERNAL://localhost:19092
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    ports:
      - "127.0.0.1:19092:9094"
    volumes:
      - broker-1-data:/var/lib/kafka/data

  broker-2:
    image: apache/kafka:4.4.0
    env_file: ./kafka.env
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker-2:9092,EXTERNAL://localhost:29092
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    ports:
      - "127.0.0.1:29092:9094"
    volumes:
      - broker-2-data:/var/lib/kafka/data

  broker-3:
    image: apache/kafka:4.4.0
    env_file: ./kafka.env
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker-3:9092,EXTERNAL://localhost:39092
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    ports:
      - "127.0.0.1:39092:9094"
    volumes:
      - broker-3-data:/var/lib/kafka/data

  init-topics:
    image: apache/kafka:4.4.0
    depends_on:
      broker-1: {condition: service_healthy}
      broker-2: {condition: service_healthy}
      broker-3: {condition: service_healthy}
    environment:
      BOOTSTRAP_SERVERS: broker-1:9092,broker-2:9092,broker-3:9092
    entrypoint: ["/bin/sh", "/scripts/create-topics.sh"]
    volumes:
      - ./scripts/create-topics.sh:/scripts/create-topics.sh:ro

  producer:
    build: .
    restart: on-failure
    depends_on:
      init-topics: {condition: service_completed_successfully}
    deploy:
      replicas: 3
    stop_grace_period: 60s
    environment:
      BOOTSTRAP_SERVERS: broker-1:9092,broker-2:9092,broker-3:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      EVENTS_PER_SECOND: ${EVENTS_PER_SECOND:-10}
      KEY_MODE: ${KEY_MODE:-user_id}

  sink:
    build: .
    entrypoint: ["/sink"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

  consumer:
    build: .
    entrypoint: ["/consumer"]
    restart: on-failure
    depends_on:
      sink: {condition: service_started}
      init-topics: {condition: service_completed_successfully}
    deploy:
      replicas: 3
    environment:
      BOOTSTRAP_SERVERS: broker-1:9092,broker-2:9092,broker-3:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      GITHUB_LOGIN: ${GITHUB_LOGIN:-}
      SINK_URL: http://sink:8080
      PROCESSING_DELAY_MS: ${PROCESSING_DELAY_MS:-20}

  lgtm:
    image: grafana/otel-lgtm:0.39.0
    profiles: [monitoring]
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - lgtm-data:/data
      - ./monitoring/grafana/provider.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/kafka.yaml:ro
      - ./monitoring/grafana/kafka-events.json:/otel-lgtm/kafka-events.json:ro

volumes:
  lgtm-data:
  broker-1-data:
  broker-2-data:
  broker-3-data:
