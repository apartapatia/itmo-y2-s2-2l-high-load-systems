[vars]
kafka = 'docker compose exec -T "${BROKER:-broker-1}" /opt/kafka/bin'
bootstrap = '--bootstrap-server localhost:9092'

#docker

[tasks.config]
run = "docker compose config --quiet"

[tasks.up]
run = "docker compose up --build -d"

[tasks.down]
run = "docker compose down"

[tasks.reset-kafka]
run = '''
volumes=$(docker compose config --format json | jq -er '.volumes["broker-1-data","broker-2-data","broker-3-data"].name // error("missing broker volume")')
docker compose down
for volume in $volumes; do
  docker volume rm --force "$volume"
done
'''

[tasks.ps]
run = "docker compose ps -a"

[tasks.logs]
run = "docker compose logs --tail=100 -f"

[tasks.start]
run = "docker compose start ${SERVICE:?specify SERVICE}"

[tasks.stop]
run = "docker compose stop ${SERVICE:?specify SERVICE}"

[tasks.client-logs]
run = "docker compose logs --since 2m --tail 10 producer consumer"

#kafka

[tasks.brokers]
run = "{{ vars.kafka }}/kafka-broker-api-versions.sh {{ vars.bootstrap }}"

[tasks.quorum]
run = "{{ vars.kafka }}/kafka-metadata-quorum.sh {{ vars.bootstrap }} describe --status"

[tasks.topics]
run = "{{ vars.kafka }}/kafka-topics.sh {{ vars.bootstrap }} --describe | column -t"

[tasks.lag]
run = '''
{{ vars.kafka }}/kafka-consumer-groups.sh \
  {{ vars.bootstrap }} --describe --group events-processor
'''

[tasks.produce]
run = '''
{{ vars.kafka }}/kafka-console-producer.sh \
  {{ vars.bootstrap }} --topic "${TOPIC:-events}" \
  --command-property acks=all
'''

[tasks.consume]
run = '''
{{ vars.kafka }}/kafka-console-consumer.sh \
  {{ vars.bootstrap }} --topic "${TOPIC:-events}" --from-beginning \
  --formatter-property print.partition=true \
  --formatter-property print.offset=true
'''

[tasks.verify]
run = "docker compose run --rm --no-deps -T --entrypoint /verify consumer"

[tasks.kill-consumer]
run = '''
workers=$(docker compose ps --status running -q consumer)
if [ -z "$workers" ]; then
  echo "No running consumer in this Compose project. Check: docker compose ps -a consumer" >&2
  exit 1
fi
worker=${workers%%[[:space:]]*}
echo "Stopping consumer $worker"
docker kill --signal=KILL "$worker"
'''

[tasks.rebalance]
run = '''
docker compose logs --no-color --since 3m --timestamps consumer |
  grep -E 'assigned|revoked|processing events\['
'''
